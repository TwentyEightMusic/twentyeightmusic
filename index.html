<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwentyEight Music</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/modal.js"></script>
    <script src="js/gigs.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F9E9C4',
                        gold: '#B8860B',
                        'gold-light': '#D4A84B',
                        'gold-dark': '#8B6914',
                        warm: '#5C4033',
                        'warm-light': '#8B7355',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-image-color">
    <main>
        <section id="home" class="min-h-screen flex flex-col relative">
            <img src="assets/images/logo-large.png" alt="twenty eight music" class="w-full h-full object-contain absolute inset-0">
            <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 z-50">
                <div class="flex items-center gap-2 md:gap-6 bg-warm/90 backdrop-blur-md px-4 md:px-8 py-3 md:py-4 rounded-full shadow-2xl border border-gold/30">
                    <button data-modal-target="#gigs-modal" class="nav-btn">
                        <span class="nav-text">Gigs</span>
                    </button>
                    <div class="w-px h-6 bg-gold/30"></div>
                    <button data-modal-target="#listen-modal" class="nav-btn">
                        <span class="nav-text">Listen</span>
                    </button>
                    <div class="w-px h-6 bg-gold/30"></div>
                    <button data-modal-target="#contact-modal" class="nav-btn">
                        <span class="nav-text">Contact</span>
                    </button>
                </div>
            </nav>
        </section>
    </main>

    <div id="overlay" class="fixed inset-0 bg-warm/60 backdrop-blur-sm hidden z-40"></div>

    <div class="modal hidden" id="gigs-modal">
        <div class="modal-content">
            <div class="modal-inner">
                <button data-close-button class="modal-close">&times;</button>
                <h2 class="modal-title">Upcoming Shows</h2>
                <p class="modal-subtitle">See when and where we are playing next</p>
                <div class="gigs-list"></div>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="listen-modal">
        <div class="modal-content">
            <div class="modal-inner">
                <button data-close-button class="modal-close">&times;</button>
                <h2 class="modal-title">Listen</h2>
                <p class="modal-subtitle">Find us on your favorite platform</p>
                <div class="music-platforms">
                    <a href="https://music.youtube.com/channel/UCcy9oL5fW2iD_aGt9z3_cZg" target="_blank" class="platform-btn">
                        <img src="assets/images/youtube.svg" alt="YouTube Music">
                        <span>YouTube Music</span>
                    </a>
                    <a href="https://open.spotify.com/artist/4UonzRCI0OOZmgnmE4B8FD" target="_blank" class="platform-btn">
                        <img src="assets/images/spotify.svg" alt="Spotify">
                        <span>Spotify</span>
                    </a>
                    <a href="https://music.twentyeightmusic.com/" target="_blank" class="platform-btn">
                        <img src="assets/images/bandcamp-button-bc-circle-grey-128.png" alt="Bandcamp">
                        <span>Bandcamp</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="modal hidden" id="contact-modal">
        <div class="modal-content">
            <div class="modal-inner">
                <button data-close-button class="modal-close">&times;</button>
                <h2 class="modal-title">Get in Touch</h2>
                <p class="modal-subtitle">For inquiries and collaborations</p>
                <div class="contact-info">
                    <a href="mailto:info@twentyeightmusic.com" class="contact-link">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <span>info@twentyeightmusic.com</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
